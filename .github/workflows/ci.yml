name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PDFFlatten.sln

      - name: Build
        run: dotnet build PDFFlatten.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test PDFFlatten.sln --configuration Release --no-build

      - name: Pack
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            VERSION="0.2.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          dotnet pack src/PDFFlatten/PDFFlatten.csproj \
            --configuration Release \
            --no-build \
            -p:Version="$VERSION" \
            --output artifacts

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.*nupkg
